name: Update README with Quote

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:  # Allows manual trigger

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README with random quote
        run: |
          # Fetch a random quote from an API
          QUOTE=$(curl -s https://api.quotable.io/random | jq -r '"\"\(.content)\" - \(.author)"')
          
          # Check if README.md exists
          if [ -f README.md ]; then
            # Replace or add the quote section
            if grep -q "## 💬 Random Dev Quote" README.md; then
              # Update existing section
              sed -i "/## 💬 Random Dev Quote/,/---/c\\## 💬 Random Dev Quote\\$QUOTE\\---" README.md
            else
              # Add new section before the footer
              sed -i "/---/i\\## 💬 Random Dev Quote\\$QUOTE\\---" README.md
            fi
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "Update README with random quote" || echo "No changes to commit"
          git push